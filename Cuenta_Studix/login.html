<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Studix para continuar con tus misiones y recompensas.">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <title> Login | Studix </title>
</head>
<body class="auth-page login-page">
    <main class="auth-shell">
        <section class="auth-illustration">
            <span class="brand-badge"> Studix </span>
            <h1> Vuelve a tu camino de aprendizaje </h1>
            <p> Continúa tus retos diarios, suma experiencia y desbloquea nuevas recompensas en tu perfil. </p>
            <div class="auth-stats">
                <div class="auth-stat-box">
                    <strong> 24 </strong>
                    <span> Días seguidos </span>
                </div>
                <div class="auth-stat-box">
                    <strong> 420 </strong>
                    <span> XP total </span>
                </div>
            </div>
        </section>
        <section class="auth-panel">
            <header class="panel-header">
                <span class="eyebrow"> Login </span>
                <h2> Iniciar sesión </h2>
                <p> Accede a tu cuenta para seguir avanzando. </p>
            </header>
            <form class="auth-form">
                <input type="text" name="username" placeholder="Nombre de usuario" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit"> Iniciar sesión </button>
            </form>
            <div class="auth-links">
                <span> ¿No tienes una cuenta? </span>
                <a href="register.html"> Regístrate aquí </a>
            </div>
        </section>
    </main>
</body>
</html>
